<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Dashboard — Manage users, analytics, and reports in one unified interface.">
    <title>Veldra — Admin Dashboard</title>
    <link rel="icon" type="image/png" href="./assets/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <link rel="stylesheet" href="./styles.css" type="text/css" />
    <script src="./script.js" defer></script>
  </head>

  <body>
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo" id="logo">
          <span class="logo-text">Veldra</span>
        </div>
        <button id="sidebar-close" class="sidebar-close" aria-label="Close sidebar">
          <i data-lucide="x"></i>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">

        <!-- General Section -->
        <div class="nav-section">
          <span class="nav-section-label">General</span>
          <ul class="nav-list">
            <li class="nav-item active">
              <a href="#" id="nav-dashboard" class="nav-link" data-page="dashboard">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-analytics" class="nav-link" data-page="analytics">
                <i data-lucide="bar-chart-3"></i>
                <span>Analytics</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-users" class="nav-link" data-page="users">
                <i data-lucide="users"></i>
                <span>Users</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-ecommerce" class="nav-link" data-page="ecommerce">
                <i data-lucide="store"></i>
                <span>E-Commerce</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-orders" class="nav-link" data-page="orders">
                <i data-lucide="shopping-cart"></i>
                <span>Orders</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-inbox" class="nav-link" data-page="inbox">
                <i data-lucide="mail"></i>
                <span>Inbox</span>
                <span class="badge">3</span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Tools Section -->
        <div class="nav-section">
          <span class="nav-section-label">Tools</span>
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#" id="nav-calendar" class="nav-link" data-page="calendar">
                <i data-lucide="calendar"></i>
                <span>Calendar</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-file-manager" class="nav-link" data-page="file-manager">
                <i data-lucide="folder-open"></i>
                <span>File Manager</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-reports" class="nav-link" data-page="reports">
                <i data-lucide="file-text"></i>
                <span>Reports</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-notifications" class="nav-link" data-page="notifications">
                <i data-lucide="bell"></i>
                <span>Notifications</span>
                <span class="badge">5</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-settings" class="nav-link" data-page="settings">
                <i data-lucide="settings"></i>
                <span>Settings</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" id="nav-help" class="nav-link" data-page="help">
                <i data-lucide="life-buoy"></i>
                <span>Help Center</span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Logout (bottom) -->
        <div class="nav-bottom">
          <div class="nav-divider"></div>
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#" id="nav-logout" class="nav-link nav-link-logout" data-page="logout">
                <i data-lucide="log-out"></i>
                <span>Logout</span>
              </a>
            </li>
          </ul>
        </div>

      </nav>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    
  </body>
</html>
